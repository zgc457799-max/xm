name: Build Mobile and Desktop Apps

on:
  push:
    branches: [ "main", "chongwu" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web App
        run: npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android APK
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: EduCode-AI-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-windows:
    name: Build Windows App
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web App
        run: npm run build

      - name: Package Windows EXE
        run: npx electron-packager . "EduCode AI" --platform=win32 --arch=x64 --out=release --overwrite

      - name: Zip Windows Release
        run: Compress-Archive -Path 'release\EduCode AI-win32-x64' -DestinationPath 'release\EduCode_AI_Windows.zip' -Force
        shell: powershell

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: EduCode-AI-Windows-ZIP
          path: release/EduCode_AI_Windows.zip
